<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="edubot-ui-version" content="export-pptx-1">
  <title>EduBot — Trợ lý Học tập AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=export-pptx-1">
</head>
<body>
  <div class="app">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <div class="logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <div>
            <div class="logo-name">EduBot</div>
            <div class="logo-sub">Trợ lý học tập AI</div>
          </div>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
          Cuộc trò chuyện mới
        </button>

        <!-- Scope Selectors -->
        <div class="book-section">
          <label class="book-label">Bộ sách đang dùng</label>
          <div class="book-select-wrapper">
            <select class="book-select" id="bookSelect">
              <option value="auto">Tự động</option>
              <option value="CD">Cánh Diều</option>
              <option value="KNTT" selected>Kết nối tri thức</option>
            </select>
            <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div class="book-section">
          <label class="book-label">Khối lớp</label>
          <div class="book-select-wrapper">
            <select class="book-select" id="gradeSelect">
              <option value="auto">Tự động</option>
              <option value="10" selected>Lớp 10</option>
              <option value="11">Lớp 11</option>
              <option value="12">Lớp 12</option>
            </select>
            <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <!-- History -->
        <div class="history-section">
          <div class="history-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Lịch sử
          </div>
          <div class="history-list" id="historyList">
            <button class="history-item active">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              Soạn giáo án Mạng LAN
            </button>
            <button class="history-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              Tạo slide chương An toàn TT
            </button>
            <button class="history-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              Giải bài tập Hệ điều hành
            </button>
          </div>
        </div>
      </div>

      <!-- User -->
      <div class="sidebar-bottom">
        <div class="user-info">
          <div class="user-avatar">GV</div>
          <div>
            <div class="user-name">User ID</div>
            <div class="user-id">USGSU05</div>
          </div>
          <button class="user-action" title="Cài đặt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5h14M5 12h14M5 19h14"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ═══ MAIN CHAT ═══ -->
    <main class="main">
      <!-- Header -->
      <header class="chat-header">
        <div class="chat-header-left">
          <h1 class="chat-title" id="chatTitle">Soạn giáo án Mạng LAN</h1>
          <div class="chat-meta">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            <span id="chatBookInfo">Kết nối tri thức - Lớp 10</span>
          </div>
        </div>
        <button class="download-all-btn" id="downloadAllBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Tải tất cả tài liệu
        </button>
      </header>

      <!-- Messages -->
      <div class="chat-body" id="chatBody">
        <div class="messages" id="messages">
          <!-- Demo messages -->
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions" id="quickActions">
        <button class="quick-btn" data-prompt="Xuất giáo án cho bài này">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          Xuất giáo án
        </button>
        <button class="quick-btn" data-prompt="Xuất slide bài giảng">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Xuất slide bài giảng
        </button>
      </div>

      <!-- Input -->
      <div class="chat-input-area">
        <div class="input-row">
          <button class="attach-btn" title="Đính kèm file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="text" class="chat-input" id="chatInput" placeholder="Hỏi bài, yêu cầu soạn giáo án, tạo slide..." autocomplete="off">
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <div class="input-hint">
          Xuất PPTX từ template mặc định — Enter để gửi, Shift+Enter để xuống dòng
        </div>
      </div>
    </main>

  </div>
  <script src="app.js?v=export-pptx-1"></script>
</body>
</html>
